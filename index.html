<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bắn Gà</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Mono:wght@500&display=swap">
<style>
/* Bố cục: một cột giữa trang. Chỉ số ở trên, sân bắn dọc tỉ lệ 3:4 ở giữa, dòng hướng dẫn ở dưới. Giao diện tối cố định theo chủ đề không gian. */
:root {
  color-scheme: dark;
  --space: #0c1127;
  --space-2: #151c3d;
  --line: #2a3566;
  --ink: #eef1ff;
  --muted: #98a3d6;
  --ship: #7fd1ff;
  --bullet: #ffe27a;
  --comb: #e0483a;
  --feather: #f6ecda;
  --feather-shade: #d3c2a3;
  --beak: #f2a93b;
  --egg: #fff6e0;
  --btn: #ffe27a;
  --btn-ink: #241b00;
  --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
  --font-mono: 'DM Mono', ui-monospace, Menlo, monospace;
}
body {
  background: var(--space);
  color: var(--ink);
  font-family: var(--font-display);
  padding-block: 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap {
  max-width: 440px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 10px 16px;
  flex-wrap: wrap;
}
h1 {
  margin: 0;
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1;
}
.scores { display: flex; gap: 14px; flex-wrap: wrap; }
.stat { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.stat span {
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.stat b {
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: 20px;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.field-box {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 4;
  max-width: 100%;
  border: 2px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
  touch-action: none;
  background: var(--space);
}
canvas { display: block; width: 100%; height: 100%; }
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  text-align: center;
  padding: 16px;
  background: rgba(12, 17, 39, 0.78);
}
.overlay h2 { margin: 0; font-size: 26px; font-weight: 800; text-wrap: balance; }
.overlay p { margin: 0; color: var(--muted); font-size: 14px; max-width: 30ch; }
.primary {
  font: inherit;
  font-weight: 800;
  font-size: 16px;
  padding: 10px 22px;
  border: 0;
  border-radius: 4px;
  background: var(--btn);
  color: var(--btn-ink);
  cursor: pointer;
}
.primary:active { transform: translateY(1px); }
.primary:focus-visible { outline: 3px solid var(--ship); outline-offset: 2px; }
.hint { margin: 0; font-size: 13px; line-height: 1.5; color: var(--muted); }
.hint kbd {
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 1px 5px;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: var(--space-2);
  color: var(--ink);
}
</style>

<div class="wrap">
  <header>
    <h1>Bắn Gà</h1>
    <div class="scores">
      <div class="stat"><span>Điểm</span><b id="score">0</b></div>
      <div class="stat"><span>Đợt</span><b id="wave">1</b></div>
      <div class="stat"><span>Mạng</span><b id="lives">3</b></div>
      <div class="stat"><span>Kỷ lục</span><b id="best">0</b></div>
    </div>
  </header>

  <div class="field-box" id="box">
    <canvas id="field" role="img" aria-label="Sân bắn gà: tàu vũ trụ ở dưới, đàn gà ở trên"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">Đàn gà đang kéo tới</h2>
      <p id="ovText">Tàu tự bắn. Bạn chỉ cần di chuyển và né trứng.</p>
      <button class="primary" id="ovBtn" type="button">Bắt đầu</button>
    </div>
  </div>

  <p class="hint">Di chuyển bằng <kbd>←</kbd> <kbd>→</kbd> hoặc <kbd>A</kbd> <kbd>D</kbd>, rê chuột hoặc kéo ngón tay trên sân. Tạm dừng bằng <kbd>Space</kbd>. Nhặt đùi gà rơi xuống để bắn súng đôi trong 8 giây.</p>
</div>

<script>
(function () {
  var W = 360, H = 480;
  var cv = document.getElementById('field');
  var ctx = cv.getContext('2d');
  var box = document.getElementById('box');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovText = document.getElementById('ovText');
  var ovBtn = document.getElementById('ovBtn');
  var elScore = document.getElementById('score');
  var elWave = document.getElementById('wave');
  var elLives = document.getElementById('lives');
  var elBest = document.getElementById('best');

  var cs = getComputedStyle(document.documentElement);
  function v(n) { return cs.getPropertyValue(n).trim(); }
  var C = {
    space: v('--space'), ship: v('--ship'), bullet: v('--bullet'), comb: v('--comb'),
    feather: v('--feather'), shade: v('--feather-shade'), beak: v('--beak'), egg: v('--egg'),
    muted: v('--muted'), ink: v('--ink')
  };

  var best = 0;
  try { best = parseInt(localStorage.getItem('ban-ga-best'), 10) || 0; } catch (e) {}
  var reduce = false;
  try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

  var state = 'ready';
  var ship, bullets, eggs, chickens, drops, parts, stars;
  var score, wave, lives, kills, invul, power, fireT, dropT, fx, fy, fdir, banner, total, tx;
  var keys = { l: false, r: false };
  var last = 0;
  var scale = 1;

  stars = [];
  for (var s = 0; s < 55; s++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.2 + 0.4, v: Math.random() * 18 + 8 });
  }

  function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

  function hud() {
    elScore.textContent = score;
    elWave.textContent = wave;
    elLives.textContent = lives;
    elBest.textContent = best;
  }

  function spawnWave() {
    var cols = 6, rows = Math.min(2 + wave, 5), sp = 46;
    var left = (W - (cols - 1) * sp) / 2;
    chickens = [];
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        chickens.push({ bx: left + c * sp, by: 50 + r * 40, ph: Math.random() * 6.28 });
      }
    }
    total = chickens.length;
    fx = 0; fy = 0; fdir = 1;
    bullets = []; eggs = []; drops = [];
    dropT = 1.2;
    banner = 1.4;
  }

  function reset() {
    score = 0; wave = 1; lives = 3; kills = 0;
    ship = { x: W / 2, y: H - 38 };
    parts = [];
    invul = 0; power = 0; fireT = 0; tx = null;
    spawnWave();
    hud();
  }

  function setOverlay(title, text, btn) {
    ovTitle.textContent = title;
    ovText.textContent = text;
    ovBtn.textContent = btn;
    overlay.hidden = false;
  }

  function start() {
    if (state === 'over') reset();
    state = 'running';
    overlay.hidden = true;
    last = 0;
  }

  function pause() {
    if (state !== 'running') return;
    state = 'paused';
    setOverlay('Tạm dừng', 'Bấm tiếp tục để quay lại trận đấu.', 'Tiếp tục');
  }

  function endGame() {
    state = 'over';
    if (score > best) {
      best = score;
      try { localStorage.setItem('ban-ga-best', String(best)); } catch (e) {}
    }
    hud();
    setOverlay('Hết mạng', 'Bạn hạ được ' + kills + ' con gà ở đợt ' + wave + '. Điểm: ' + score + '.', 'Chơi lại');
  }

  function burst(x, y) {
    for (var i = 0; i < 9; i++) {
      var a = Math.random() * 6.28, sp = 40 + Math.random() * 90;
      parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.55 });
    }
  }

  function update(dt) {
    var i, j;
    if (keys.l || keys.r) {
      tx = null;
      ship.x += ((keys.r ? 1 : 0) - (keys.l ? 1 : 0)) * 260 * dt;
    } else if (tx !== null) {
      var d = tx - ship.x;
      ship.x += (d < 0 ? -1 : 1) * Math.min(Math.abs(d), 520 * dt);
    }
    ship.x = clamp(ship.x, 20, W - 20);
    invul = Math.max(0, invul - dt);
    power = Math.max(0, power - dt);
    banner = Math.max(0, banner - dt);

    if (!reduce) {
      for (i = 0; i < stars.length; i++) {
        stars[i].y += stars[i].v * dt;
        if (stars[i].y > H) { stars[i].y = 0; stars[i].x = Math.random() * W; }
      }
    }

    fireT -= dt;
    if (fireT <= 0) {
      fireT = 0.24;
      if (power > 0) {
        bullets.push({ x: ship.x - 8, y: ship.y - 18 });
        bullets.push({ x: ship.x + 8, y: ship.y - 18 });
      } else {
        bullets.push({ x: ship.x, y: ship.y - 18 });
      }
    }
    for (i = bullets.length - 1; i >= 0; i--) {
      bullets[i].y -= 440 * dt;
      if (bullets[i].y < -14) bullets.splice(i, 1);
    }

    var minB = 1e9, maxB = -1e9;
    for (i = 0; i < chickens.length; i++) {
      minB = Math.min(minB, chickens[i].bx);
      maxB = Math.max(maxB, chickens[i].bx);
    }
    var vx = (40 + wave * 8) * (1 + ((total - chickens.length) / total) * 1.2);
    fx += fdir * vx * dt;
    if ((fdir > 0 && maxB + fx + 16 > W - 6) || (fdir < 0 && minB + fx - 16 < 6)) {
      fdir = -fdir;
      fy += 14;
    }

    dropT -= dt;
    if (dropT <= 0 && chickens.length) {
      var ch = chickens[Math.floor(Math.random() * chickens.length)];
      eggs.push({ x: ch.bx + fx, y: ch.by + fy + 10, v: 130 + wave * 12 });
      dropT = Math.max(0.35, 1.1 - wave * 0.1) * (0.6 + Math.random() * 0.8);
    }
    for (i = eggs.length - 1; i >= 0; i--) {
      eggs[i].y += eggs[i].v * dt;
      if (eggs[i].y > H + 10) eggs.splice(i, 1);
    }
    for (i = drops.length - 1; i >= 0; i--) {
      drops[i].y += 90 * dt;
      if (drops[i].y > H + 10) drops.splice(i, 1);
    }

    for (i = bullets.length - 1; i >= 0; i--) {
      for (j = chickens.length - 1; j >= 0; j--) {
        var cx = chickens[j].bx + fx, cy = chickens[j].by + fy;
        if (Math.abs(bullets[i].x - cx) < 16 && Math.abs(bullets[i].y - cy) < 14) {
          score += 10;
          kills++;
          burst(cx, cy);
          if (Math.random() < 0.15) drops.push({ x: cx, y: cy });
          chickens.splice(j, 1);
          bullets.splice(i, 1);
          break;
        }
      }
    }

    for (i = drops.length - 1; i >= 0; i--) {
      if (Math.abs(drops[i].x - ship.x) < 20 && Math.abs(drops[i].y - ship.y) < 22) {
        power = 8;
        score += 5;
        drops.splice(i, 1);
      }
    }

    if (invul <= 0) {
      for (i = eggs.length - 1; i >= 0; i--) {
        if (Math.abs(eggs[i].x - ship.x) < 15 && Math.abs(eggs[i].y - ship.y) < 18) {
          lives--;
          burst(ship.x, ship.y);
          eggs = [];
          invul = 1.6;
          hud();
          if (lives <= 0) { endGame(); return; }
          break;
        }
      }
    }

    for (i = 0; i < chickens.length; i++) {
      if (chickens[i].by + fy + 14 > ship.y - 14) { lives = 0; hud(); endGame(); return; }
    }

    for (i = parts.length - 1; i >= 0; i--) {
      parts[i].x += parts[i].vx * dt;
      parts[i].y += parts[i].vy * dt;
      parts[i].life -= dt;
      if (parts[i].life <= 0) parts.splice(i, 1);
    }

    if (!chickens.length) {
      wave++;
      score += 50;
      spawnWave();
    }
    hud();
  }

  function ellipse(x, y, rx, ry, rot) {
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawChicken(x, y, t, ph) {
    var flap = Math.sin(t * 10 + ph) * 0.45;
    ctx.fillStyle = C.shade;
    ellipse(x - 11, y + 1, 7, 4, -0.5 - flap);
    ellipse(x + 11, y + 1, 7, 4, 0.5 + flap);
    ctx.fillStyle = C.feather;
    ellipse(x, y + 2, 12, 10);
    ellipse(x, y - 9, 6, 6);
    ctx.fillStyle = C.comb;
    ellipse(x - 3.5, y - 15.5, 2.6, 2.6);
    ellipse(x, y - 17, 2.8, 2.8);
    ellipse(x + 3.5, y - 15.5, 2.6, 2.6);
    ctx.fillStyle = C.beak;
    ctx.beginPath();
    ctx.moveTo(x - 2.5, y - 8);
    ctx.lineTo(x + 2.5, y - 8);
    ctx.lineTo(x, y - 4);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = C.space;
    ellipse(x - 2.6, y - 10.5, 1.2, 1.2);
    ellipse(x + 2.6, y - 10.5, 1.2, 1.2);
  }

  function drawShip(t) {
    if (invul > 0 && Math.floor(t * 12) % 2 === 0) return;
    var x = ship.x, y = ship.y;
    ctx.fillStyle = C.bullet;
    ctx.beginPath();
    ctx.moveTo(x - 5, y + 10);
    ctx.lineTo(x + 5, y + 10);
    ctx.lineTo(x, y + 18 + (reduce ? 3 : Math.random() * 6));
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = C.ship;
    ctx.beginPath();
    ctx.moveTo(x, y - 18);
    ctx.lineTo(x + 9, y + 6);
    ctx.lineTo(x + 18, y + 14);
    ctx.lineTo(x + 6, y + 10);
    ctx.lineTo(x - 6, y + 10);
    ctx.lineTo(x - 18, y + 14);
    ctx.lineTo(x - 9, y + 6);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = C.space;
    ellipse(x, y - 2, 4, 5);
  }

  function draw(t) {
    var i;
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.fillStyle = C.space;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = C.muted;
    for (i = 0; i < stars.length; i++) {
      ctx.globalAlpha = 0.35 + stars[i].r * 0.3;
      ctx.fillRect(stars[i].x, stars[i].y, stars[i].r * 1.4, stars[i].r * 1.4);
    }
    ctx.globalAlpha = 1;

    for (i = 0; i < chickens.length; i++) {
      drawChicken(chickens[i].bx + fx, chickens[i].by + fy, t, chickens[i].ph);
    }

    for (i = 0; i < drops.length; i++) {
      var dx = drops[i].x, dy = drops[i].y;
      ctx.strokeStyle = C.feather;
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(dx + 3, dy + 3);
      ctx.lineTo(dx + 9, dy + 9);
      ctx.stroke();
      ctx.fillStyle = '#c9783a';
      ellipse(dx, dy, 7, 6);
    }

    ctx.fillStyle = C.egg;
    for (i = 0; i < eggs.length; i++) ellipse(eggs[i].x, eggs[i].y, 5, 6.5);

    ctx.fillStyle = C.bullet;
    for (i = 0; i < bullets.length; i++) {
      ctx.beginPath();
      ctx.roundRect(bullets[i].x - 2, bullets[i].y - 8, 4, 12, 2);
      ctx.fill();
    }

    drawShip(t);

    for (i = 0; i < parts.length; i++) {
      ctx.globalAlpha = Math.max(0, parts[i].life / 0.55);
      ctx.fillStyle = C.feather;
      ctx.fillRect(parts[i].x - 1.5, parts[i].y - 1.5, 3, 3);
    }
    ctx.globalAlpha = 1;

    ctx.textAlign = 'left';
    ctx.fillStyle = C.bullet;
    ctx.font = '500 12px "DM Mono", ui-monospace, monospace';
    if (power > 0) ctx.fillText('Súng đôi ' + Math.ceil(power) + 's', 10, H - 10);

    if (banner > 0 && state === 'running') {
      ctx.textAlign = 'center';
      ctx.fillStyle = C.ink;
      ctx.font = '800 30px "Bricolage Grotesque", system-ui, sans-serif';
      ctx.globalAlpha = Math.min(1, banner);
      ctx.fillText('Đợt ' + wave, W / 2, H / 2);
      ctx.globalAlpha = 1;
    }
  }

  function frame(ts) {
    requestAnimationFrame(frame);
    if (!last) last = ts;
    var dt = Math.min(0.033, (ts - last) / 1000);
    last = ts;
    if (state === 'running') update(dt);
    draw(ts / 1000);
  }

  function fit() {
    var dpr = window.devicePixelRatio || 1;
    var w = Math.round(cv.clientWidth * dpr);
    if (w < 10) return;
    cv.width = w;
    cv.height = Math.round(w * H / W);
    scale = cv.width / W;
  }

  function setTarget(e) {
    var r = cv.getBoundingClientRect();
    tx = (e.clientX - r.left) / r.width * W;
  }

  box.addEventListener('pointerdown', setTarget);
  box.addEventListener('pointermove', function (e) {
    if (e.pointerType === 'mouse' || e.buttons) setTarget(e);
  });

  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { e.preventDefault(); keys.l = true; }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { e.preventDefault(); keys.r = true; }
    else if (k === ' ' || k === 'p' || k === 'P') {
      e.preventDefault();
      if (state === 'running') pause(); else start();
    }
  });
  document.addEventListener('keyup', function (e) {
    var k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.l = false;
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.r = false;
  });

  ovBtn.addEventListener('click', start);
  window.addEventListener('resize', fit);
  document.addEventListener('visibilitychange', function () { if (document.hidden) pause(); });

  reset();
  fit();
  requestAnimationFrame(frame);
})();
</script>

</body></html>
